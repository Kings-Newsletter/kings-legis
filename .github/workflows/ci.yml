name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Ainda não há package-lock.json no repositório: o primeiro `npm install`
      # local gera o arquivo. Depois de versioná-lo, troque por `npm ci` e
      # ligue `cache: npm` no setup-node acima.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Sem MONGODB_URI as páginas mostram o estado vazio,
      # então o build não precisa de banco nem de segredos.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
